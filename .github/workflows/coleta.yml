name: Coleta de precos

# Catalogo completo a cada 3 horas: 07h, 10h, 13h, 16h e 19h de Brasilia (UTC-3).
# A Americanas (catalogo enorme) entra so na rodada das 07h (run_hours em config/markets.yaml).
# O GitHub pode atrasar execucoes agendadas em alguns minutos em horarios de pico.
# Para rodar na hora: aba Actions > Coleta de precos > Run workflow.
on:
  schedule:
    - cron: "0 10,13,16,19,22 * * *"
  workflow_dispatch:
    inputs:
      todas:
        description: "Coletar todas as redes, inclusive as que tem horario proprio (Americanas)"
        type: boolean
        default: false

concurrency:
  group: coleta
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  coleta:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      TZ: America/Sao_Paulo
      ECONOMIX_RUN_ALL: ${{ inputs.todas && '1' || '' }}
      PYTHONIOENCODING: utf-8
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-cloud.txt

      - name: Instalar dependencias
        run: |
          pip install -r requirements-cloud.txt
          python -m playwright install --with-deps chromium

      # Banco das ultimas ~26h (necessario para calcular as quedas) vem da execucao anterior.
      - name: Restaurar banco
        uses: actions/cache/restore@v4
        with:
          path: |
            data/economix.db
            data/state
          key: economix-db-sjrp-${{ github.run_id }}
          restore-keys: economix-db-sjrp-

      - name: Coletar
        run: python -m economix collect

      - name: Quedas de preco -> Telegram (so se houver)
        run: |
          if [ -n "$TELEGRAM_BOT_TOKEN" ]; then python -m economix oportunidades --enviar; else python -m economix oportunidades; fi

      - name: Exportar arquivos do painel
        run: python scripts/export_dashboard.py

      - name: Podar banco (ultima, anterior e base de 24h)
        run: python scripts/prune_db.py 24

      - name: Salvar banco
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            data/economix.db
            data/state
          key: economix-db-sjrp-${{ github.run_id }}

      - name: Anexar arquivos do painel
        uses: actions/upload-artifact@v4
        with:
          name: painel
          path: data/dashboard/*.json
          retention-days: 3

      - name: Anexar evidencias
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evidencias
          path: data/evidence
          retention-days: 7
          if-no-files-found: ignore
