name: Coleta de precos

# Catalogo completo a cada 3 horas: 07h, 10h, 13h, 16h e 19h de Brasilia (UTC-3).
# A Americanas (catalogo enorme) entra 1x por dia (min_interval_hours em config/markets.yaml).
# O GitHub atrasa ou descarta execucoes agendadas no minuto :00 (pico). Por isso:
#   - horario principal no minuto :07;
#   - segunda tentativa no minuto :47, que so coleta se a principal nao rodou.
# Para rodar na hora: aba Actions > Coleta de precos > Run workflow.
on:
  schedule:
    - cron: "7 10,13,16,19,22 * * *"
    - cron: "47 10,13,16,19,22 * * *"
  workflow_dispatch:
    inputs:
      todas:
        description: "Coletar todas as redes, inclusive as que tem horario proprio (Americanas)"
        type: boolean
        default: false

concurrency:
  group: coleta
  cancel-in-progress: false

permissions:
  contents: read
  actions: write   # a segunda tentativa se cancela quando a rodada ja foi coletada

jobs:
  coleta:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      TZ: America/Sao_Paulo
      ECONOMIX_RUN_ALL: ${{ inputs.todas && '1' || '' }}
      PYTHONIOENCODING: utf-8
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
    steps:
      # Segunda tentativa: se outra coleta comecou nos ultimos 100 min e nao falhou, nao repete.
      - name: Verificar se esta rodada ja foi coletada
        id: guard
        if: github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          since=$(date -u -d '100 minutes ago' +%Y-%m-%dT%H:%M:%SZ)
          q='[.[] | select(.databaseId != '"$GITHUB_RUN_ID"' and .createdAt >= "'"$since"'" and (.status != "completed" or .conclusion == "success"))] | length'
          n=$(gh run list -R "$GITHUB_REPOSITORY" -w coleta.yml -L 20 --json databaseId,createdAt,status,conclusion --jq "$q")
          echo "coletas recentes: $n"
          if [ "$n" -gt 0 ]; then
            echo "skip=1" >> "$GITHUB_OUTPUT"
            # cancelada (e nao "sucesso"), para o painel nao buscar arquivos numa execucao vazia
            gh run cancel "$GITHUB_RUN_ID" -R "$GITHUB_REPOSITORY"
          fi

      - uses: actions/checkout@v4
        if: steps.guard.outputs.skip != '1'

      - uses: actions/setup-python@v5
        if: steps.guard.outputs.skip != '1'
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-cloud.txt

      - name: Instalar dependencias
        if: steps.guard.outputs.skip != '1'
        run: |
          pip install -r requirements-cloud.txt
          python -m playwright install --with-deps chromium

      # Banco das ultimas ~26h (necessario para calcular as quedas) vem da execucao anterior.
      - name: Restaurar banco
        if: steps.guard.outputs.skip != '1'
        uses: actions/cache/restore@v4
        with:
          path: |
            data/economix.db
            data/state
          key: economix-db-sjrp-${{ github.run_id }}
          restore-keys: economix-db-sjrp-

      - name: Coletar
        if: steps.guard.outputs.skip != '1'
        run: python -m economix collect

      - name: Quedas de preco -> Telegram (so se houver)
        if: steps.guard.outputs.skip != '1'
        run: |
          if [ -n "$TELEGRAM_BOT_TOKEN" ]; then python -m economix oportunidades --enviar; else python -m economix oportunidades; fi

      - name: Exportar arquivos do painel
        if: steps.guard.outputs.skip != '1'
        run: python scripts/export_dashboard.py

      - name: Podar banco (ultima, anterior e base de 24h)
        if: steps.guard.outputs.skip != '1'
        run: python scripts/prune_db.py 24

      - name: Salvar banco
        if: steps.guard.outputs.skip != '1' && always()
        uses: actions/cache/save@v4
        with:
          path: |
            data/economix.db
            data/state
          key: economix-db-sjrp-${{ github.run_id }}

      - name: Anexar arquivos do painel
        if: steps.guard.outputs.skip != '1'
        uses: actions/upload-artifact@v4
        with:
          name: painel
          path: data/dashboard/*.json
          retention-days: 3

      - name: Anexar evidencias
        if: steps.guard.outputs.skip != '1' && always()
        uses: actions/upload-artifact@v4
        with:
          name: evidencias
          path: data/evidence
          retention-days: 7
          if-no-files-found: ignore
